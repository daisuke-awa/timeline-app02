<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクトタイムライン管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        .timeline-grid::-webkit-scrollbar { height: 8px; }
        .timeline-grid::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .timeline-grid::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .timeline-grid::-webkit-scrollbar-thumb:hover { background: #555; }
        .task-bar { transition: all 0.3s ease-in-out; }
        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.selected {
            border-color: #3b82f6; /* blue-500 */
            box-shadow: 0 0 0 2px white;
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s, bottom 0.5s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8">
        <!-- ヘッダー -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">プロジェクトタイムライン</h1>
                <p class="text-gray-500 mt-1">共有可能なプロジェクトスケジュール管理ツール</p>
            </div>
            <div class="flex items-center space-x-2">
                <button id="add-project-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">
                    <i class="fas fa-plus mr-2"></i>プロジェクト追加
                </button>
                 <button id="share-btn" class="p-2 rounded-full bg-white hover:bg-gray-200 transition shadow-sm" title="共有リンクをコピー">
                    <i class="fas fa-share-alt text-gray-600"></i>
                </button>
                <div id="auth-status" class="text-sm font-medium text-gray-500 flex items-center bg-white px-3 py-2 rounded-lg shadow-sm">
                   <i class="fas fa-users text-green-500 mr-2"></i>共有モード
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
            <!-- コントロールパネル -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <div id="month-navigation" class="flex items-center">
                    <button id="prev-month-btn" class="p-2 rounded-full hover:bg-gray-200 transition"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="current-month-display" class="text-xl md:text-2xl font-semibold mx-4 w-48 text-center"></h2>
                    <button id="next-month-btn" class="p-2 rounded-full hover:bg-gray-200 transition"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="flex items-center bg-gray-200 rounded-full p-1">
                    <button id="view-1m" class="px-4 py-1 text-sm font-semibold rounded-full bg-white shadow">1ヶ月</button>
                    <button id="view-3m" class="px-4 py-1 text-sm font-semibold rounded-full text-gray-600">3ヶ月</button>
                </div>
            </div>

            <!-- タイムラインエリア -->
            <div id="timeline-container" class="overflow-x-auto timeline-grid"></div>
        </div>
         <footer class="text-center mt-8 text-gray-400 text-sm">
            <p>データはリアルタイムで共有されます。担当者や進捗、タスクの色も管理可能です。</p>
        </footer>
    </div>
    
    <!-- モーダル各種 -->
    <div id="project-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 shadow-2xl w-full max-w-md m-4">
            <h3 class="text-2xl font-bold mb-6">新しいプロジェクト</h3>
            <input type="text" id="project-name-input" placeholder="プロジェクト名を入力" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end mt-6 space-x-3">
                <button onclick="closeModal('project-modal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800 transition">キャンセル</button>
                <button id="save-project-btn" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold transition">保存</button>
            </div>
        </div>
    </div>

    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 overflow-y-auto py-10">
        <div class="bg-white rounded-lg p-8 shadow-2xl w-full max-w-md m-4">
            <h3 class="text-2xl font-bold mb-2">タスク編集</h3>
            <p id="task-modal-project-name" class="text-gray-500 mb-6"></p>
            <input type="hidden" id="task-project-id-input">
            <input type="hidden" id="task-color-input">
            <div class="space-y-4">
                <input type="text" id="task-name-input" placeholder="タスク名" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                <input type="text" id="task-assignee-input" placeholder="担当者名" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">色</label>
                    <div id="task-color-selector" class="flex flex-wrap gap-2 p-2 bg-gray-100 rounded-lg">
                        <!-- 色選択の要素がJSでここに挿入されます -->
                    </div>
                </div>
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">進捗状況</label>
                    <select id="task-status-input" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                        <option value="not-started">未着手</option>
                        <option value="in-progress">進行中</option>
                        <option value="completed">完了</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">開始日</label>
                    <input type="date" id="task-start-date-input" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">終了日</label>
                    <input type="date" id="task-end-date-input" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex justify-between items-center mt-6">
                <button id="delete-task-btn" class="px-6 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-bold transition">削除</button>
                <div class="space-x-3">
                    <button onclick="closeModal('task-modal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800 transition">キャンセル</button>
                    <button id="save-task-btn" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold transition">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="confirm-dialog" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"></div>
    <div id="toast-container" class="toast"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 設定 ---------------------------------------------------

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyC5fwufh6LJRKmXxdAHLxCByPcIPRZcFiE",
  authDomain: "team-timeline-app02.firebaseapp.com",
  projectId: "team-timeline-app02",
  storageBucket: "team-timeline-app02.appspot.com",
  messagingSenderId: "86921543288",
  appId: "1:86921543288:web:4deb62c2146e4855cff78d"
};
const appId = firebaseConfig.projectId; // プロジェクトIDをappIdとして使用します
//

// Initialize Firebase
const app = initializeApp(firebaseConfig);
        
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- グローバル変数・状態 --------------------------------------
        let projects = [];
        let tasks = [];
        let projectUnsubscribe = () => {};
        let taskUnsubscribe = () => {};
        
        let currentDate = new Date();
        let displayMonths = 1;
        
        const taskColors = [
            'bg-red-400', 'bg-orange-400', 'bg-amber-400', 'bg-yellow-400', 'bg-lime-400', 
            'bg-green-400', 'bg-emerald-400', 'bg-teal-400', 'bg-cyan-400', 'bg-sky-400', 
            'bg-blue-400', 'bg-indigo-400', 'bg-violet-400', 'bg-purple-400', 'bg-fuchsia-400', 
            'bg-pink-400', 'bg-rose-400', 'bg-gray-400'
        ];
        const defaultTaskColor = 'bg-gray-400';

        // --- DOM要素 --------------------------------------------------
        const timelineContainer = document.getElementById('timeline-container');
        const monthDisplay = document.getElementById('current-month-display');

        // --- パス設定 (共有用) ---------------------------------------
        const projectCollectionPath = `artifacts/${appId}/public/data/projects`;
        const taskCollectionPath = `artifacts/${appId}/public/data/tasks`;

        // --- 日付ヘルパー --------------------------------------------
        const addMonths = (date, months) => new Date(date.getFullYear(), date.getMonth() + months, 1);
        const getDaysInPeriod = (start, end) => (end - start) / (1000 * 60 * 60 * 24);

        // --- UI描画 ----------------------------------------------------
        function renderTimeline() {
            if (!timelineContainer) return;
            const startDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const endDate = addMonths(startDate, displayMonths);
            endDate.setDate(endDate.getDate() - 1);

            if(displayMonths === 1) {
                monthDisplay.textContent = `${startDate.getFullYear()}年 ${startDate.getMonth() + 1}月`;
            } else {
                monthDisplay.textContent = `${startDate.getFullYear()}/${startDate.getMonth() + 1} ~ ${endDate.getFullYear()}/${endDate.getMonth() + 1}`;
            }

            const totalDays = getDaysInPeriod(startDate, endDate) + 1;
            
            let monthsHeaderHtml = '';
            let weeksHeaderHtml = '';
            let weekGridCols = 0;
            
            for (let m = 0; m < displayMonths; m++) {
                const monthDate = addMonths(startDate, m);
                const year = monthDate.getFullYear();
                const month = monthDate.getMonth();
                const weeksInMonth = getWeeksInMonth(year, month);
                
                monthsHeaderHtml += `<div class="text-center font-bold p-2 border-b border-r border-gray-200" style="grid-column: span ${weeksInMonth.length};">${year}年 ${month + 1}月</div>`;

                weeksInMonth.forEach(week => {
                    weeksHeaderHtml += `<div class="text-center font-semibold p-2 border-r border-gray-200 text-sm">
                        ${week.start.getDate()}日-${week.end.getDate()}日
                    </div>`;
                });
                weekGridCols += weeksInMonth.length;
            }

            let html = `<div class="grid" style="min-width: ${300 * displayMonths}px;">`;
            // ヘッダー
            html += `<div class="grid grid-cols-[200px,1fr] sticky top-0 bg-white z-20">
                        <div class="font-bold p-3 border-b-2 border-gray-200 flex items-center">プロジェクト</div>
                        <div>
                           <div class="grid" style="grid-template-columns: repeat(${weekGridCols}, 1fr);">${monthsHeaderHtml}</div>
                           <div class="grid" style="grid-template-columns: repeat(${weekGridCols}, 1fr);">${weeksHeaderHtml}</div>
                        </div>
                     </div>`;
            
            // プロジェクト行
            projects.forEach((project, index) => {
                html += `<div class="grid grid-cols-[200px,1fr] border-b border-gray-200 group relative" style="min-height: 60px; height: ${60 + tasks.filter(t => t.projectId === project.id).length * 32}px">`;
                // プロジェクト名
                html += `<div class="p-3 border-r border-gray-200 flex items-center justify-between">
                            <span class="font-medium truncate">${project.name}</span>
                            <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="move-project-btn text-gray-500 hover:text-gray-800" data-id="${project.id}" data-direction="-1" ${index === 0 ? 'disabled' : ''}><i class="fas fa-arrow-up"></i></button>
                                <button class="move-project-btn text-gray-500 hover:text-gray-800" data-id="${project.id}" data-direction="1" ${index === projects.length - 1 ? 'disabled' : ''}><i class="fas fa-arrow-down"></i></button>
                                <button class="add-task-btn text-blue-500 hover:text-blue-700" data-id="${project.id}" data-name="${project.name}"><i class="fas fa-plus-circle"></i></button>
                                <button class="delete-project-btn text-red-500 hover:text-red-700" data-id="${project.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                         </div>`;

                // タイムラインセル
                html += `<div class="relative grid" style="grid-template-columns: repeat(${totalDays}, 1fr);">`;
                
                // タスクバー描画
                const projectTasks = tasks.filter(t => t.projectId === project.id);
                projectTasks.forEach((task, taskIndex) => {
                    const taskStart = new Date(task.startDate + 'T00:00:00');
                    const taskEnd = new Date(task.endDate + 'T00:00:00');

                    if (taskEnd < startDate || taskStart > endDate) return;

                    const effectiveStart = taskStart < startDate ? startDate : taskStart;
                    const effectiveEnd = taskEnd > endDate ? endDate : taskEnd;

                    const startDayIndex = getDaysInPeriod(startDate, effectiveStart);
                    const duration = getDaysInPeriod(effectiveStart, effectiveEnd) + 1;
                    
                    const left = (startDayIndex / totalDays) * 100;
                    const width = (duration / totalDays) * 100;
                    const colorClass = task.color || defaultTaskColor;
                    const completedClass = task.status === 'completed' ? 'opacity-70' : '';
                    
                    let taskLabelHtml = '';
                    if (task.status === 'completed') {
                        taskLabelHtml = `<span class="truncate flex items-center"><i class="fas fa-check-circle mr-2"></i><s class="opacity-90">${task.name}</s></span>`;
                    } else {
                        taskLabelHtml = `<span class="truncate"><i class="fas fa-user-circle mr-1"></i>${task.assignee || ''} ${task.name}</span>`;
                    }


                    html += `<div class="task-bar absolute h-6 rounded-md flex items-center px-2 text-xs text-white font-medium shadow-sm cursor-pointer ${colorClass} ${completedClass}"
                                 style="left: ${left}%; width: ${width}%; top: ${5 + taskIndex * 32}px;" 
                                 title="${task.name} | ${task.assignee || '未割り当て'} (${task.startDate} ~ ${task.endDate})"
                                 data-id="${task.id}">
                                 ${taskLabelHtml}
                             </div>`;
                });
                html += `</div></div>`;
            });
            html += `</div>`;
            timelineContainer.innerHTML = html;
            setupActionButtons();
        }
        
        // --- データ操作 (Firestore) --------------------------------
        function setupFirestoreListeners() {
            projectUnsubscribe();
            taskUnsubscribe();

            const qProjects = query(collection(db, projectCollectionPath), orderBy("order"));
            projectUnsubscribe = onSnapshot(qProjects, (snapshot) => {
                projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTimeline();
            }, console.error);
            
            const qTasks = query(collection(db, taskCollectionPath));
            taskUnsubscribe = onSnapshot(qTasks, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTimeline();
            }, console.error);
        }

        // --- アクション関数 -----------------------------------------
        const addProject = async (name) => {
            if (!name.trim()) return;
            const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.order || 0)) : 0;
            await addDoc(collection(db, projectCollectionPath), { name: name.trim(), order: maxOrder + 1 });
        };

        const deleteProject = async (projectId) => {
            const batch = writeBatch(db);
            tasks.filter(t => t.projectId === projectId).forEach(task => {
                batch.delete(doc(db, taskCollectionPath, task.id));
            });
            batch.delete(doc(db, projectCollectionPath, projectId));
            await batch.commit();
        };

        const saveTask = async (data) => {
            if (!data.name.trim() || !data.projectId) return;
            if (data.startDate && data.endDate && data.startDate > data.endDate) {
                [data.startDate, data.endDate] = [data.endDate, data.startDate];
            }
            
            const { id, ...dataForFirestore } = data; // Destructure to separate id from the rest of the data
            
            const docRef = id ? doc(db, taskCollectionPath, id) : doc(collection(db, taskCollectionPath));
            await setDoc(docRef, dataForFirestore, { merge: true }); // Save only the data meant for Firestore
        };
        
        const deleteTask = async (taskId) => {
            if (!taskId) return;
            try {
                await deleteDoc(doc(db, taskCollectionPath, taskId));
                closeModal('task-modal');
                showToast('タスクを削除しました。');
            } catch (e) {
                console.error("タスクの削除に失敗しました:", e);
                showToast('タスクの削除中にエラーが発生しました。');
            }
        };
        
        const moveProject = async (projectId, direction) => {
            const index = projects.findIndex(p => p.id === projectId);
            if ((direction === -1 && index === 0) || (direction === 1 && index === projects.length - 1)) return;
            
            const otherIndex = index + direction;
            const project1 = projects[index];
            const project2 = projects[otherIndex];

            const batch = writeBatch(db);
            batch.update(doc(db, projectCollectionPath, project1.id), { order: project2.order });
            batch.update(doc(db, projectCollectionPath, project2.id), { order: project1.order });
            await batch.commit();
        };
        
        // --- UIイベントリスナー設定 -----------------------------------
        function setupActionButtons() {
            document.querySelectorAll('.move-project-btn').forEach(b => b.onclick = (e) => moveProject(e.currentTarget.dataset.id, parseInt(e.currentTarget.dataset.direction)));
            document.querySelectorAll('.add-task-btn').forEach(b => b.onclick = (e) => openTaskModal({ projectId: e.currentTarget.dataset.id, projectName: e.currentTarget.dataset.name }));
            document.querySelectorAll('.delete-project-btn').forEach(b => b.onclick = (e) => showConfirm('プロジェクト削除', '関連タスクも全て削除されます。よろしいですか？', () => deleteProject(e.currentTarget.dataset.id)));
            document.querySelectorAll('.task-bar').forEach(b => b.onclick = (e) => {
                 const task = tasks.find(t => t.id === e.currentTarget.dataset.id);
                 if (task) openTaskModal(task);
            });
        }
        
        // --- モーダル & ダイアログ -----------------------------------
        window.openModal = (id) => document.getElementById(id).classList.replace('hidden', 'flex');
        window.closeModal = (id) => document.getElementById(id).classList.replace('flex', 'hidden');

        function openTaskModal(taskData) {
            // モーダル内の要素にタスクデータを設定
            document.getElementById('task-project-id-input').value = taskData.projectId;
            document.getElementById('task-modal-project-name').textContent = `プロジェクト: ${taskData.projectName || projects.find(p=>p.id===taskData.projectId)?.name || ''}`;
            document.getElementById('task-name-input').value = taskData.name || '';
            document.getElementById('task-assignee-input').value = taskData.assignee || '';
            document.getElementById('task-status-input').value = taskData.status || 'not-started';
            document.getElementById('task-start-date-input').value = taskData.startDate || '';
            document.getElementById('task-end-date-input').value = taskData.endDate || '';
            
            // 色選択のUIを生成・設定
            const colorSelector = document.getElementById('task-color-selector');
            const colorInput = document.getElementById('task-color-input');
            colorSelector.innerHTML = taskColors.map(color => 
                `<div class="color-swatch ${color}" data-color="${color}"></div>`
            ).join('');
            
            let selectedColor = taskData.color || defaultTaskColor;
            colorInput.value = selectedColor;
            colorSelector.querySelectorAll('.color-swatch').forEach(swatch => {
                if (swatch.dataset.color === selectedColor) swatch.classList.add('selected');
                swatch.onclick = () => {
                    colorSelector.querySelector('.selected')?.classList.remove('selected');
                    swatch.classList.add('selected');
                    colorInput.value = swatch.dataset.color;
                };
            });
            
            // --- ここからが修正箇所 ---
            const saveBtn = document.getElementById('save-task-btn');
            const deleteBtn = document.getElementById('delete-task-btn');

            // 削除ボタンの表示制御
            if (taskData.id) {
                deleteBtn.style.display = 'block';
            } else {
                deleteBtn.style.display = 'none';
            }

            // 保存ボタンのクリックイベントを設定
            saveBtn.onclick = () => {
                const dataToSave = {
                    id: taskData.id, // 新規の場合はundefined
                    projectId: document.getElementById('task-project-id-input').value,
                    name: document.getElementById('task-name-input').value,
                    assignee: document.getElementById('task-assignee-input').value,
                    status: document.getElementById('task-status-input').value,
                    color: document.getElementById('task-color-input').value,
                    startDate: document.getElementById('task-start-date-input').value,
                    endDate: document.getElementById('task-end-date-input').value,
                };
                saveTask(dataToSave);
                closeModal('task-modal');
            };

            // 削除ボタンのクリックイベントを設定
            deleteBtn.onclick = () => {
                if (taskData.id) {
                    showConfirm('タスクを削除', 'このタスクを本当に削除しますか？この操作は元に戻せません。', () => {
                        deleteTask(taskData.id);
                    });
                }
            };
            // --- 修正箇所ここまで ---

            openModal('task-modal');
            document.getElementById('task-name-input').focus();
        }
        
        function showConfirm(title, message, onConfirm) {
            const dialog = document.getElementById('confirm-dialog');
            dialog.innerHTML = `<div class="bg-white rounded-lg p-8 shadow-2xl w-full max-w-sm m-4">
                <h3 class="text-xl font-bold mb-4">${title}</h3>
                <p class="text-gray-600 mb-6">${message}</p>
                <div class="flex justify-end mt-6 space-x-3">
                    <button id="confirm-cancel" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800 transition">キャンセル</button>
                    <button id="confirm-ok" class="px-6 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-bold transition">OK</button>
                </div>
            </div>`;
            dialog.classList.replace('hidden', 'flex');
            dialog.querySelector('#confirm-ok').onclick = () => { onConfirm(); dialog.classList.replace('flex', 'hidden'); };
            dialog.querySelector('#confirm-cancel').onclick = () => dialog.classList.replace('flex', 'hidden');
        }
        
        window.showToast = (message) => {
            const toast = document.getElementById('toast-container');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
        
        // --- 初期化処理 ----------------------------------------------
        window.onload = () => {
            onAuthStateChanged(auth, user => {
                if (user) {
                    setupFirestoreListeners();
                } else {
                    signInAnonymously(auth).catch(error => {
                        console.error("Anonymous sign-in failed:", error);
                        document.getElementById('auth-status').innerHTML = `<i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>接続エラー`;
                    });
                }
            });

            document.getElementById('prev-month-btn').onclick = () => { currentDate = addMonths(currentDate, -1); renderTimeline(); };
            document.getElementById('next-month-btn').onclick = () => { currentDate = addMonths(currentDate, 1); renderTimeline(); };
            
            const view1m = document.getElementById('view-1m');
            const view3m = document.getElementById('view-3m');
            view1m.onclick = () => { 
                displayMonths = 1; 
                renderTimeline();
                view1m.classList.add('bg-white', 'shadow');
                view3m.classList.remove('bg-white', 'shadow');
            };
            view3m.onclick = () => {
                displayMonths = 3;
                renderTimeline();
                view3m.classList.add('bg-white', 'shadow');
                view1m.classList.remove('bg-white', 'shadow');
            };

            document.getElementById('add-project-btn').onclick = () => { openModal('project-modal'); document.getElementById('project-name-input').focus(); };
            document.getElementById('save-project-btn').onclick = () => {
                const input = document.getElementById('project-name-input');
                addProject(input.value);
                input.value = '';
                closeModal('project-modal');
            };
            
            document.getElementById('share-btn').onclick = () => {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => showToast('共有リンクをクリップボードにコピーしました！'))
                    .catch(() => showToast('コピーに失敗しました'));
            };
            
            window.getWeeksInMonth = (year, month) => {
                const weeks = [];
                let date = new Date(year, month, 1);
                while (date.getMonth() === month) {
                    const weekStart = new Date(date);
                    const weekEnd = new Date(date);
                    weekEnd.setDate(weekEnd.getDate() + 6);
                    if (weekEnd.getMonth() !== month) {
                        weekEnd.setDate(new Date(year, month + 1, 0).getDate());
                    }
                    weeks.push({ start: weekStart, end: weekEnd });
                    date.setDate(weekEnd.getDate() + 1);
                }
                return weeks;
            };

            renderTimeline();
        };
    </script>
</body>
</html>
